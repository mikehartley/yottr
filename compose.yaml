# Local development stack. spring-boot-docker-compose starts it when the app runs.
#
# Host ports are kept away from the usual 3000/9090 so they don't clash with other projects:
#   Prometheus  http://localhost:39090
#   Grafana     http://localhost:33000  (anonymous viewing; admin / admin to edit)
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: yottr
      POSTGRES_USER: yottr
      POSTGRES_PASSWORD: yottr
    ports:
      - "5432"
    volumes:
      - yottr-data:/var/lib/postgresql

  prometheus:
    image: prom/prometheus:v3.15.1
    ports:
      - "39090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # the app runs on the host, not in compose
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:13.2.4
    ports:
      - "33000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  yottr-data:
