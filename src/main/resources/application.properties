spring.application.name=yottr

# Locally, Postgres comes from compose.yaml (spring-boot-docker-compose starts it and supplies the connection).
# Elsewhere set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/yottr
spring.datasource.username=yottr
spring.datasource.hikari.maximum-pool-size=20

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks that it matches the entities.
# A database created by Hibernate before Flyway is baselined at V1, the schema it already has.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Everything a page shows is loaded by the service layer, inside its transaction.
spring.jpa.open-in-view=false

spring.messages.basename=Messages
spring.messages.use-code-as-default-message=true

spring.data.web.pageable.default-page-size=4
spring.data.web.pageable.max-page-size=30

spring.web.resources.cache.period=31556926s
# Static files are cached for a year, so their URLs carry a hash of the content: a changed file gets a new URL.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/resources/**

# loggers is for administrators only (see SecurityConfig); the /admin/logging page uses it too
management.endpoints.web.exposure.include=health,prometheus,loggers
management.metrics.tags.application=${spring.application.name}
# histogram buckets, so Grafana can show request latency percentiles
management.metrics.distribution.percentiles-histogram.http.server.requests=true

logging.level.uk.co.yottr=info
