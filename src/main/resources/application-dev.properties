# Local development: ./mvnw spring-boot:run turns this profile on.

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# templates are picked up without a restart
spring.thymeleaf.cache=false

logging.level.org.springframework.security=debug

# one-click sign-in as test users on the home page, from a file that isn't committed (see TestUsers)
spring.config.import=optional:file:./test-users.properties
