<!DOCTYPE html>
<html layout:decorate="~{mainTemplate}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<body>
<section layout:fragment="content" id="edit-listing-content" class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <h1 class="h2 mb-4">Edit your listing</h1>
            <form method="post" th:action="@{/s/listings/{boatReference}/edit(boatReference=${boatReference})}" th:object="${boat}" id="listing-form" novalidate="novalidate">
                <fieldset th:replace="~{listingFields :: boat}">The boat's fields go here.</fieldset>
                <fieldset th:replace="~{listingFields :: terms}">The sailing, crew and money fields go here.</fieldset>
            </form>
        </div>
    </div>
</section>
</body>
</html>
