<!DOCTYPE html>
<!--/* Page links for a PageWrapper in the model as "wrapper". Call it as control(url='/the/list'). */-->
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="control" th:if="${wrapper.page.totalPages > 1}" aria-label="Pages" th:with="page=${wrapper.page}">
    <ul class="pagination flex-wrap justify-content-center">
        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <a class="page-link" th:href="@{${url}(page=0,size=${page.size})}">First</a>
        </li>
        <li class="page-item" th:classappend="${page.hasPrevious()} ? '' : 'disabled'">
            <a class="page-link" th:href="@{${url}(page=${page.number - 1},size=${page.size})}" aria-label="Previous">&laquo;</a>
        </li>
        <li class="page-item" th:each="i : ${#numbers.sequence(wrapper.rangeStart, wrapper.rangeEnd)}"
            th:classappend="${page.number == i} ? 'active'">
            <a class="page-link" th:href="@{${url}(page=${i},size=${page.size})}" th:text="${i + 1}"
               th:attr="aria-current=${page.number == i} ? 'page'">1</a>
        </li>
        <li class="page-item" th:classappend="${page.hasNext()} ? '' : 'disabled'">
            <a class="page-link" th:href="@{${url}(page=${page.number + 1},size=${page.size})}" aria-label="Next">&raquo;</a>
        </li>
        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link text-nowrap" th:href="@{${url}(page=${page.totalPages - 1},size=${page.size})}"
               th:text="'Last (' + ${page.totalPages} + ')'">Last</a>
        </li>
    </ul>
</nav>
</body>
</html>
