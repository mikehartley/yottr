<!DOCTYPE html>
<html layout:decorate="~{mainTemplate}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<body>
<section layout:fragment="content" id="member-details-content" class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h1 class="h2">Member details</h1>

            <form method="post" th:action="@{/admin/user/{userid}/edit(userid=${member.id})}" th:object="${details}"
                  id="member-details-form" class="yottr-card p-4" novalidate="novalidate">
                <dl class="row mb-3">
                    <dt class="col-sm-4">Username</dt>
                    <dd class="col-sm-8" th:text="${member.username}">Username</dd>
                    <dt class="col-sm-4">Joined</dt>
                    <dd class="col-sm-8" th:text="${member.joined} ? ${#temporals.format(member.joined, 'd MMM yyyy')} : 'Not recorded'">28 Oct 2026</dd>
                    <dt class="col-sm-4">Listings</dt>
                    <dd class="col-sm-8">
                        <span th:if="${member.boatListings.empty}">None</span>
                        <!--/* links to each listing's page, where an administrator can withdraw or delete it */-->
                        <ul class="list-unstyled mb-0" th:unless="${member.boatListings.empty}">
                            <li th:each="boat : ${member.boatListings}">
                                <a th:href="@{/s/listings/{boatReference}(boatReference=${boat.reference})}" th:text="${boat.title}">Weekends in the Solent</a>
                                <span class="yottr-badge yottr-badge-warning" th:if="${boat.withdrawn}">Withdrawn</span>
                                <span class="yottr-badge yottr-badge-warning" th:if="${boat.suspended}">Suspended</span>
                            </li>
                        </ul>
                    </dd>
                </dl>

                <th:block th:replace="~{personalDetails :: fields}"></th:block>
                <div class="row g-3">
                    <div class="col-sm-5">
                        <div th:replace="~{fields :: textField(name='maxListings', label='Listings allowed', type='number')}"></div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a class="btn btn-outline-secondary" th:href="@{/admin/users}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</section>
</body>
</html>
