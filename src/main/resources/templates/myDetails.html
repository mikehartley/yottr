<!DOCTYPE html>
<html layout:decorate="~{mainTemplate}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<body>
<section layout:fragment="content" id="mydetails-content" class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h1 class="h2">My Details</h1>
            <div class="alert alert-success" id="mydetails-updated-msg" th:if="${param.updated != null}">
                Your details are saved.
            </div>

            <form method="post" th:action="@{/s/myDetails}" th:object="${user}" id="signup-form" class="yottr-card p-4" novalidate="novalidate">
                <dl class="row mb-3">
                    <dt class="col-sm-4">Username</dt>
                    <dd class="col-sm-8" th:text="${username}">Username</dd>
                    <dt class="col-sm-4">Listings</dt>
                    <dd class="col-sm-8"><span th:text="${listingCount}">1</span> of <span th:text="${maxListings}">2</span></dd>
                </dl>

                <div th:replace="~{fields :: textField(name='password', label='New password', type='password', hint='At least 12 characters. Leave it blank to keep your current password.')}"></div>
                <th:block th:replace="~{personalDetails :: fields}"></th:block>

                <div class="d-flex justify-content-between align-items-center">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="submit" form="delete-me-form" class="btn btn-outline-danger"
                            onclick="return confirm('This will permanently delete your account and your listings. Are you sure?')">Delete my account</button>
                </div>
            </form>
            <form id="delete-me-form" method="post" th:action="@{/s/deleteMe}"></form>

            <!--/* th:replace runs before th:if, so the check is on a block around it */-->
            <th:block th:if="${crewSide}"><section th:replace="~{crewProfile :: section}">My crew profile</section></th:block>
        </div>
    </div>
</section>
</body>
</html>
