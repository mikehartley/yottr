<!DOCTYPE html>
<html layout:decorate="~{mainTemplate}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<body>
<section layout:fragment="content" id="signup-success-content" class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 yottr-card p-4">
            <h1 class="h3">Hello <span th:text="${user.firstName}">FirstName</span>, welcome to Yottr.</h1>
            <p>Your username is <strong th:text="${user.username}">UserBob</strong>, which you sign in with.</p>
            <p>Happy sailing!</p>
            <a class="btn btn-primary" th:href="@{/index}">Sign in</a>
        </div>
    </div>
</section>
</body>
</html>
