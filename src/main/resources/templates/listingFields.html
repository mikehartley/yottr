<!DOCTYPE html>
<!--/* The fields of a listing, shared by the new and edit listing pages, in two parts: the boat, and the terms
       (the sailing, the crew wanted and the money). Include them inside a form whose th:object is a ListingForm,
       with the listing reference data in the model (BoatController.addListingFormReferenceData). */-->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<fieldset th:fragment="boat" class="yottr-card p-4 mb-4">
    <legend class="h5">The boat</legend>
    <div th:replace="~{fields :: textField(name='title', label='Title', hint='What a sailor sees first, such as Weekends in the Solent on a Sigma 33.')}"></div>
    <div class="row g-3">
        <div class="col-sm-8">
            <div th:replace="~{fields :: textField(name='makeAndModel', label='Make and model')}"></div>
        </div>
        <div class="col-sm-4">
            <div th:replace="~{fields :: textField(name='yearBuilt', label='Year built', type='number')}"></div>
        </div>
    </div>
    <div class="row g-3">
        <div class="col-sm-5">
            <div class="mb-3">
                <label class="form-label" for="length">Length</label>
                <div class="input-group">
                    <input type="number" class="form-control" th:field="*{length}" th:errorclass="is-invalid"/>
                    <!--/* the units, as a pair of toggle buttons */-->
                    <input type="radio" class="btn-check" th:field="*{unitsImperial}" value="true"/>
                    <label class="btn btn-outline-primary" th:for="${#ids.prev('unitsImperial')}">ft</label>
                    <input type="radio" class="btn-check" th:field="*{unitsImperial}" value="false"/>
                    <label class="btn btn-outline-primary" th:for="${#ids.prev('unitsImperial')}">m</label>
                </div>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('length')}" th:errors="*{length}">Bad length</div>
            </div>
        </div>
        <div class="col-sm-4">
            <div th:replace="~{fields :: selectField(name='vesselType', label='Type', options=${vesselTypes}, blank='Choose')}"></div>
        </div>
        <div class="col-sm-3">
            <div th:replace="~{fields :: selectField(name='hullType', label='Hull', options=${hullTypes})}"></div>
        </div>
    </div>
    <div th:replace="~{fields :: textArea(name='description', label='Description', rows=6, hint='The boat, the plans and the people. Up to 2000 characters.')}"></div>
</fieldset>

<fieldset th:fragment="terms" class="yottr-card p-4 mb-4">
    <legend class="h5">The sailing</legend>
    <div class="row g-3">
        <div class="col-sm-6">
            <div th:replace="~{fields :: selectField(name='sailingPurpose', label='Purpose', options=${sailingPurposes}, blank='Choose')}"></div>
        </div>
        <div class="col-sm-6">
            <div th:replace="~{fields :: selectField(name='courseLevel', label='Course level', options=${courseLevels}, blank='None', also='courseLevelGivenWhenNeeded', hint='For a course, or for tuition.')}"></div>
        </div>
    </div>
    <div th:replace="~{fields :: checkboxField(name='frequency', label='When', options=${frequencies})}"></div>
    <div class="row g-3">
        <div class="col-sm-4">
            <div th:replace="~{fields :: textField(name='whenFrom', label='From', hint='dd/mm/yyyy, optional', also='whenFromNotAfterWhenTo')}"></div>
        </div>
        <div class="col-sm-4">
            <div th:replace="~{fields :: textField(name='whenTo', label='To', hint='Leave it empty if open-ended')}"></div>
        </div>
        <div class="col-sm-4">
            <div th:replace="~{fields :: textField(name='dateRelevantTo', label='Listing ends', hint='dd/mm/yyyy, optional')}"></div>
        </div>
    </div>

    <h3 class="h5 mt-2">The crew</h3>
    <div class="row g-3">
        <div class="col-sm-4">
            <div th:replace="~{fields :: selectField(name='roleRequired', label='Looking for', options=${rolesRequired}, blank='Choose')}"></div>
        </div>
        <div class="col-sm-3">
            <div th:replace="~{fields :: textField(name='numberOfCrewWanted', label='How many', type='number', hint='Optional')}"></div>
        </div>
        <div class="col-sm-5">
            <div class="mb-3">
                <label class="form-label" for="minimumRequiredLevelByRank">Minimum level</label>
                <select class="form-select" th:field="*{minimumRequiredLevelByRank}"
                        th:classappend="${#fields.hasErrors('minimumRequiredLevelKnown')} ? 'is-invalid'">
                    <option th:each="level : ${ryaSailCruisingLevels}" th:value="${level.rank}" th:text="${level.displayName}">None</option>
                </select>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('minimumRequiredLevelKnown')}" th:errors="*{minimumRequiredLevelKnown}">Unknown level</div>
            </div>
        </div>
    </div>

    <h3 class="h5 mt-2">The money</h3>
    <div class="row g-3">
        <div class="col-sm-5">
            <div th:replace="~{fields :: selectField(name='financialArrangement', label='Costs', options=${financialArrangements})}"></div>
        </div>
        <div class="col-sm-4">
            <div th:replace="~{fields :: selectField(name='travelExpenses', label='Travel to the boat', options=${travelExpensesOptions})}"></div>
        </div>
        <div class="col-sm-3">
            <div th:replace="~{fields :: selectField(name='smoking', label='Smoking', options=${smokingOptions})}"></div>
        </div>
    </div>
    <div class="row g-3">
        <div class="col-sm-5">
            <div th:replace="~{fields :: textField(name='moneyAmount', label='Amount (£)', type='number', also='moneyGivenUnlessNoCost', hint='What crew pay, or are paid. Not needed when there is no cost to crew; for shared running costs, an estimate.')}"></div>
        </div>
        <div class="col-sm-4">
            <div th:replace="~{fields :: selectField(name='moneyPeriod', label='For', options=${moneyPeriods}, blank='Choose')}"></div>
        </div>
        <div class="col-sm-3">
            <div th:replace="~{fields :: selectField(name='commercialOffering', label='What is offered', options=${commercialOfferings}, blank='Not commercial', also='commercialOfferingGivenWhenCommercial', hint='Only when crew pay a business.')}"></div>
        </div>
    </div>

    <button type="submit" class="btn btn-primary">Save the listing</button>
</fieldset>

</body>
</html>
