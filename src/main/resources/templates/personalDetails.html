<!DOCTYPE html>
<!--/* A member's details, shared by sign-up and My Details. Include it inside a form whose th:object is a
       PersonalDetailsForm, with the countries in the model. */-->
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="fields">
    <!--/* what they're on Yottr as; the site shows them what's relevant to that (MemberSides) */-->
    <fieldset class="mb-3" id="sides">
        <legend class="form-label fs-6">I'm on Yottr</legend>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" th:field="*{crew}" th:classappend="${#fields.hasErrors('crewOrOwner')} ? 'is-invalid'"/>
            <label class="form-check-label" th:for="${#ids.prev('crew')}">as crew, looking for boats to sail on</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" th:field="*{owner}" th:classappend="${#fields.hasErrors('crewOrOwner')} ? 'is-invalid'"/>
            <label class="form-check-label" th:for="${#ids.prev('owner')}">as an owner, looking for crew</label>
        </div>
        <div class="form-text">Either or both. You only see what's relevant, and can change it later.</div>
        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('crewOrOwner')}" th:errors="*{crewOrOwner}">Tick at least one.</div>
    </fieldset>
    <div class="row g-3">
        <div class="col-sm-3">
            <div th:replace="~{fields :: textField(name='title', label='Title')}"></div>
        </div>
        <div class="col-sm-4">
            <div th:replace="~{fields :: textField(name='firstName', label='First name')}"></div>
        </div>
        <div class="col-sm-5">
            <div th:replace="~{fields :: textField(name='lastName', label='Last name')}"></div>
        </div>
    </div>
    <div class="row g-3">
        <div class="col-sm-7">
            <div th:replace="~{fields :: textField(name='email', label='Email', type='email')}"></div>
        </div>
        <div class="col-sm-5">
            <div th:replace="~{fields :: textField(name='mobile', label='Mobile', type='tel')}"></div>
        </div>
    </div>
    <div class="row g-3">
        <div class="col-sm-7">
            <div th:replace="~{fields :: selectField(name='country', label='Country', options=${countries}, blank='Choose a country')}"></div>
        </div>
        <div class="col-sm-5">
            <div th:replace="~{fields :: textField(name='postcode', label='Postcode', hint='Needed for a UK address')}"></div>
        </div>
    </div>
    <div th:replace="~{fields :: textArea(name='aboutMe', label='About me', hint='Your sailing so far, and what you are looking for. Up to 400 characters.')}"></div>
</th:block>
</body>
</html>
