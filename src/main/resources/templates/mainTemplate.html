<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="en-GB">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="description" content="For boats looking for crew, and crew looking for boats."/>
    <title>Yottr</title>

    <script>
        // Bootstrap's colour modes switch on data-bs-theme, so this follows the visitor's light or dark preference.
        (function () {
            const dark = window.matchMedia('(prefers-color-scheme: dark)');
            const apply = () => document.documentElement.setAttribute('data-bs-theme', dark.matches ? 'dark' : 'light');
            apply();
            dark.addEventListener('change', apply);
        })();
    </script>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}" rel="stylesheet"/>
    <link th:href="@{/resources/css/yottr.css}" rel="stylesheet"/>
    <link rel="icon" type="image/svg+xml" th:href="@{/resources/images/favicon.svg}"/>
</head>
<body>

<nav class="navbar navbar-expand-xl navbar-dark yottr-nav" aria-label="Main">
    <div class="container">
        <a class="navbar-brand yottr-brand" th:href="@{/}">
            <img th:src="@{/resources/images/logo.svg}" alt=""/>
            <span>Yottr</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav"
                aria-controls="main-nav" aria-expanded="false" aria-label="Show the menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="main-nav">
            <!--/* crew's and owners' items only for members who are on Yottr as such (MemberSides puts "sides" in the request) */-->
            <ul class="navbar-nav ms-auto align-items-xl-center">
                <li class="nav-item" sec:authorize="hasAuthority('FREE')"><a th:replace="~{menu :: menuLink(path='/s/listings/all', text='Boats')}">Boats</a></li>
                <li class="nav-item" sec:authorize="hasAuthority('FREE')" th:if="${sides != null and sides.crew}"><a th:replace="~{menu :: menuLink(path='/s/listings/saved', text='Saved')}">Saved</a></li>
                <li class="nav-item" sec:authorize="hasAuthority('FREE')" th:if="${sides != null and sides.crew}"><a th:replace="~{menu :: menuLink(path='/s/crew', text='Crewing')}">Crewing</a></li>
                <li class="nav-item" sec:authorize="hasAuthority('FREE')" th:if="${sides != null and sides.owner}"><a th:replace="~{menu :: menuLink(path='/s/crew/find', text='Find crew')}">Find crew</a></li>
                <li class="nav-item" sec:authorize="hasAuthority('FREE')" th:if="${sides != null and sides.owner}"><a th:replace="~{menu :: menuLink(path='/s/listings/mine', text='My Listings')}">My Listings</a></li>
                <li class="nav-item" sec:authorize="hasAuthority('FREE')"><a th:replace="~{menu :: menuLink(path='/s/myDetails', text='My Details')}">My Details</a></li>
                <li class="nav-item" sec:authorize="hasAuthority('ADMIN')"><a th:replace="~{menu :: menuLink(path='/admin/users', text='Members')}">Members</a></li>
                <li class="nav-item" sec:authorize="hasAuthority('ADMIN')"><a th:replace="~{menu :: menuLink(path='/admin/logging', text='Logging', id='logging-link')}">Logging</a></li>
                <li class="nav-item" sec:authorize="hasAuthority('ADMIN')"><a th:replace="~{menu :: menuLink(path='/admin/blocked', text='Blocked')}">Blocked</a></li>
                <li class="nav-item" sec:authorize="isAnonymous()"><a th:replace="~{menu :: menuLink(path='/signup', text='Join')}">Join</a></li>
                <li class="nav-item ms-xl-2" sec:authorize="hasAuthority('FREE')" th:if="${sides != null and sides.owner}">
                    <a class="btn btn-light btn-sm" th:href="@{/s/listings/new}" th:attr="aria-current=${currentMenuItem == '/s/listings/new'} ? 'page'"><i class="bi bi-plus-lg" aria-hidden="true"></i> Add a boat</a>
                </li>
                <li class="nav-item ms-xl-2" sec:authorize="isAuthenticated()">
                    <form class="inline-action" method="post" th:action="@{/logout}">
                        <button type="submit" id="logout-link" class="btn btn-link nav-link">Sign out</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main id="main-content">
    <!--/* each page's content replaces this, and owns its own container, so that a page can run full width */-->
    <section layout:fragment="content">
        <p>The page's content goes here.</p>
    </section>
</main>

<footer class="yottr-footer py-4 mt-5">
    <div class="container d-flex flex-column flex-sm-row justify-content-between gap-2 small">
        <span>Yottr: boats looking for crew, and crew looking for boats. <a th:href="@{/about}" class="link-secondary ms-1">About</a>
            <a th:href="@{/faq}" class="link-secondary ms-1">FAQ</a>
            <a th:href="@{/terms}" class="link-secondary ms-1">Terms</a>
            <a th:href="@{/privacy}" class="link-secondary ms-1">Privacy</a></span>
        <span>Built <span th:text="#{build.date}">10-03-2014 12:00:00</span></span>
    </div>
</footer>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
</body>
</html>
