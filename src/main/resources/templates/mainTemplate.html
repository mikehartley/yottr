<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="en-GB">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="description" content="For boats looking for crew, and crew looking for boats."/>
    <title>Yottr</title>

    <script>
        // Bootstrap's colour modes switch on data-bs-theme, so this follows the visitor's light or dark preference.
        (function () {
            const dark = window.matchMedia('(prefers-color-scheme: dark)');
            const apply = () => document.documentElement.setAttribute('data-bs-theme', dark.matches ? 'dark' : 'light');
            apply();
            dark.addEventListener('change', apply);
        })();
    </script>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}" rel="stylesheet"/>
    <link th:href="@{/resources/css/yottr.css}" rel="stylesheet"/>
    <link rel="icon" type="image/svg+xml" th:href="@{/resources/images/favicon.svg}"/>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark yottr-nav" aria-label="Main">
    <div class="container">
        <a class="navbar-brand yottr-brand" th:href="@{/}">
            <img th:src="@{/resources/images/logo.svg}" alt=""/>
            <span>Yottr</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav"
                aria-controls="main-nav" aria-expanded="false" aria-label="Show the menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="main-nav">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item" sec:authorize="hasAuthority('FREE')"><a class="nav-link" th:href="@{/s/listings/all}">Boats</a></li>
                <li class="nav-item" sec:authorize="hasAuthority('FREE')"><a class="nav-link" th:href="@{/s/listings/mine}">My Listings</a></li>
                <li class="nav-item" sec:authorize="hasAuthority('FREE')"><a class="nav-link" th:href="@{/s/myDetails}">My Details</a></li>
                <li class="nav-item" sec:authorize="hasAuthority('ADMIN')"><a class="nav-link" th:href="@{/admin/users}">Members</a></li>
                <li class="nav-item" sec:authorize="hasAuthority('ADMIN')"><a class="nav-link" th:href="@{/admin/logging}" id="logging-link">Logging</a></li>
                <li class="nav-item" sec:authorize="isAnonymous()"><a class="nav-link" th:href="@{/signup}">Join</a></li>
                <li class="nav-item ms-lg-2" sec:authorize="hasAuthority('FREE')">
                    <a class="btn btn-light btn-sm" th:href="@{/s/listings/new}"><i class="bi bi-plus-lg" aria-hidden="true"></i> Add a boat</a>
                </li>
                <li class="nav-item ms-lg-2" sec:authorize="isAuthenticated()">
                    <form class="inline-action" method="post" th:action="@{/logout}">
                        <button type="submit" id="logout-link" class="btn btn-link nav-link">Sign out</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main id="main-content">
    <!--/* each page's content replaces this, and owns its own container, so that a page can run full width */-->
    <section layout:fragment="content">
        <p>The page's content goes here.</p>
    </section>
</main>

<footer class="yottr-footer py-4 mt-5">
    <div class="container d-flex flex-column flex-sm-row justify-content-between gap-2 small">
        <span>Yottr: boats looking for crew, and crew looking for boats.</span>
        <span>Built <span th:text="#{build.date}">10-03-2014 12:00:00</span></span>
    </div>
</footer>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
