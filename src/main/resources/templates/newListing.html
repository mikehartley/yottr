<!DOCTYPE html>
<html layout:decorate="~{mainTemplate}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<body>
<section layout:fragment="content" id="index-content" class="container">
    <div class="row">
        <form method="post" th:action="@{/s/listings/new}" th:object="${boat}" th:id="signup-form" th:if="${allowedMoreListings}">

            <div class="col-sm-6">
                <h2>Enter boat details:</h2>

                <fieldset th:replace="~{listingFields :: boat}">The boat's fields go here.</fieldset>
            </div>

            <div class="col-sm-6">
                <div class="gap"></div>
                <div class="gap"></div>
                <div class="gap"></div>
                <div class="gap"></div>

                <fieldset th:replace="~{listingFields :: terms}">The sailing, crew and money fields go here.</fieldset>
            </div>
        </form>
        <div th:if="${not allowedMoreListings}">
            You have reached the limit of the number of listings you can have. If you would like to post more listings then please contact admin.
        </div>
    </div>

</section>
</body>
</html>
