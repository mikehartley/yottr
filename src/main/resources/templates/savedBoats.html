<!DOCTYPE html>
<html layout:decorate="~{mainTemplate}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<body>
<section layout:fragment="content" id="saved-boats-content" class="container py-4">
    <h1 class="h2 mb-4">Saved boats</h1>
    <p th:if="${boats.empty}" class="text-body-secondary">You haven't saved any boats yet. Use Save on a listing to keep it here.</p>
    <th:block th:each="boat : ${boats}">
        <!--/* th:replace runs before th:if, so the check is on a block around it */-->
        <th:block th:if="${boat.visible}"><article th:replace="~{listing :: card(boat=${boat}, actions=~{:: savedAction})}">A listing.</article></th:block>
        <!--/* one other members can't see any more: just enough to recognise it, and the means to clear it */-->
        <article th:unless="${boat.visible}" class="yottr-card yottr-listing p-4 mb-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                <div>
                    <h2 class="h5 mb-1 text-body-secondary" th:text="${boat.title}">Weekends in the Solent</h2>
                    <span class="text-body-secondary"><span class="yottr-listing-make" th:text="${boat.makeAndModel}">Sigma 33</span></span>
                    <span class="yottr-badge yottr-badge-warning ms-1">No longer available</span>
                </div>
                <div th:replace="~{:: savedAction}">Remove</div>
            </div>
        </article>
    </th:block>

    <div th:remove="all">
        <div th:fragment="savedAction">
            <form th:replace="~{listing :: saveButton(reference=${boat.reference}, saved=true, next='/s/listings/saved')}">Saved</form>
        </div>
    </div>
</section>
</body>
</html>
