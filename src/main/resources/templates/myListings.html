<!DOCTYPE html>
<html layout:decorate="~{mainTemplate}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<body>
<section layout:fragment="content" id="my-listings-content" class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2 mb-0">My Listings</h1>
        <a class="btn btn-primary" th:href="@{/s/listings/new}"><i class="bi bi-plus-lg" aria-hidden="true"></i> Add a boat</a>
    </div>
    <div class="alert alert-success" id="mydetails-updated-msg" th:if="${param.updated != null}">
        Your listing is saved.
    </div>
    <p th:if="${boatListings.empty}" class="text-body-secondary">You haven't listed a boat yet.</p>
    <th:block th:each="boat : ${boatListings}">
        <article th:replace="~{listing :: card(boat=${boat}, actions=~{:: listingActions})}">A listing.</article>
    </th:block>

    <!--/* the actions at the foot of each of the member's own listings, given to the card above */-->
    <div th:remove="all">
        <div th:fragment="listingActions" class="d-flex gap-2">
            <a class="btn btn-sm btn-outline-primary" th:href="@{/s/listings/{boatReference}/edit(boatReference=${boat.reference})}">Edit</a>
            <a class="btn btn-sm btn-outline-primary" th:href="@{/s/listings/{boatReference}/pictures(boatReference=${boat.reference})}">Pictures</a>
            <form class="inline-action" method="post" th:action="@{/s/listings/{boatReference}/suspended/flip(boatReference=${boat.reference})}">
                <button type="submit" class="btn btn-sm btn-outline-secondary" th:text="${boat.suspended} ? 'Re-enable' : 'Suspend'">Suspend</button>
            </form>
            <form class="inline-action" method="post" th:action="@{/s/listings/{boatReference}/delete(boatReference=${boat.reference})}">
                <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this listing for good?')">Delete</button>
            </form>
        </div>
    </div>
</section>
</body>
</html>
